[project]
name = "pjecz-delphinus-flask"
version = "0.1.1"
description = "Sistema para las atenciones de Defensoría."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-moment>=1.0.6",
    "flask-socketio>=5.6.1",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.0.0",
    "hashids>=1.3.1",
    "jinja2>=3.1.6",
    "lxml[html-clean]>=6.1.1",
    "openpyxl>=3.1.5",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rq>=2.10.0",
    "sendgrid>=6.12.5",
    "sqlalchemy>=2.0.51",
    "sqlalchemy-utils>=0.42.1",
    "typer>=0.27.0",
    "unidecode>=1.4.0",
    "uvicorn>=0.52.0",
    "werkzeug>=3.1.8",
    "xhtml2pdf>=0.2.17",
]

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821", "RUF012"]
line-length = 128

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
